<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrostWear</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="top-nav">
        <!-- Logo -->
        <div class="logo">
            <img src="./asset/logo.png" alt="FrostWear Logo">
        </div>

        <!-- Search Bar -->
        <div class="search-box">
            <input type="text" placeholder="Search for products...">
            <button>
                <img src="./asset/search.svg" alt="Search">
            </button>
        </div>

        <!-- Right side -->
        <div class="actions">
            <a href="#" class="action-item">
                <img src="./asset/circle-user.svg" alt="User">
                <span>Account</span>
            </a>
            <a href="#" class="action-item">
                <img src="./asset/heart.svg" alt="Wishlist">
                <span>Wishlist</span>
            </a>
            <a href="#" class="action-item">
                <img src="./asset/shopping-cart.svg" alt="Cart">
                <span>Cart</span>
            </a>
        </div>
    </nav>

    <nav class="bottom-nav">
        <ul>
            <li>
                <a href="#" class="categories">
                    <img src="./asset/menu.svg" alt="Menu">
                    <span>Categories</span>
                </a>
            </li>
            <li><a href="#">Home</a></li>
            <li><a href="#">Men</a></li>
            <li><a href="#">Women</a></li>
            <li><a href="#">Winter Wear</a></li>
            <li><a href="#">New Arrivals</a></li>
            <li><a href="#">Sale</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

</body>

</html>
